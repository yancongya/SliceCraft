services:
  image-splitter:
    image: image-splitter:amd64
    container_name: image-splitter
    ports:
      - "8001:8001"
    volumes:
      - /vol1/1000/services/data/image-splitter:/app/data
      - model-cache:/root/.cache
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

volumes:
  model-cache:
