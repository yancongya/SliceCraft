[package]
name = "slicecraft"
version = "0.1.0"
description = "SliceCraft — 界面元素提取与识别桌面版"
authors = []
edition = "2021"

[lib]
name = "slicecraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
