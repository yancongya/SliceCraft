<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片元素拆分工具</title>
    <style>
        :root {
            --bg: #fafafa;
            --bg-card: #ffffff;
            --bg-hover: #f0f0f0;
            --bg-active: #e8e8e8;
            --text: #171717;
            --text-2: #525252;
            --text-3: #a3a3a3;
            --border: #e5e5e5;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-bg: #eff6ff;
            --success: #16a34a;
            --warn: #d97706;
            --danger: #dc2626;
            --radius: 8px;
            --shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            color: var(--text);
            background: var(--bg);
            height: 100vh;
            overflow: hidden;
        }
        
        button { font-family: inherit; cursor: pointer; border: none; background: none; }
        input, select { font-family: inherit; font-size: inherit; }
        .hidden { display: none !important; }
        
        /* ============ 布局 ============ */
        .app { display: flex; flex-direction: column; height: 100vh; }
        
        .header {
            height: 48px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 16px;
            flex-shrink: 0;
        }
        
        .logo { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
        .logo svg { width: 20px; height: 20px; color: var(--accent); }
        
        .tabs { display: flex; gap: 4px; background: var(--bg); padding: 3px; border-radius: 8px; }
        
        .tab {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-2);
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 28px;
        }
        
        .tab:hover { color: var(--text); background: var(--bg-hover); }
        .tab.active { color: var(--text); background: var(--bg-card); box-shadow: var(--shadow); }
        
        .badge {
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .spacer { flex: 1; }
        .version { font-size: 11px; color: var(--text-3); }
        
        .main { flex: 1; overflow: hidden; }
        .panel { display: none; height: 100%; }
        .panel.active { display: flex; }
        
        /* ============ 面板布局 ============ */
        .layout { display: flex; flex: 1; overflow: hidden; }
        
        .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* 侧栏宽度拖拽手柄 */
        .sidebar-resize {
            position: absolute;
            left: -4px;
            top: 0; bottom: 0;
            width: 8px;
            cursor: ew-resize;
            z-index: 10;
        }
        .sidebar-resize::after {
            content: '';
            position: absolute;
            left: 3px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 36px;
            border-radius: 2px;
            background: var(--border);
            transition: background 0.15s;
        }
        .sidebar-resize:hover::after { background: var(--accent); }
        
        /* 底栏高度拖拽手柄 */
        .bar-resize {
            position: absolute;
            top: -4px;
            left: 0; right: 0;
            height: 8px;
            cursor: ns-resize;
            z-index: 10;
        }
        .bar-resize::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 3px;
            transform: translateX(-50%);
            width: 36px;
            height: 4px;
            border-radius: 2px;
            background: var(--border);
            transition: background 0.15s;
        }
        .bar-resize:hover::after { background: var(--accent); }
        
        .sidebar {
            width: 280px;
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: relative;
            flex-shrink: 0;
            overflow-y: auto;
        }
        
        /* ============ 预览区 ============ */
        .preview {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
            background: var(--bg);
            user-select: none;
            -webkit-user-select: none;
        }
        
        .preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: var(--radius);
            user-select: none;
            -webkit-user-drag: none;
        }
        
        /* 上传区 */
        .upload {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 32px;
            border: 2px dashed var(--border);
            border-radius: 12px;
            cursor: pointer;
            max-width: 360px;
        }
        
        .upload:hover { border-color: var(--accent); background: var(--accent-bg); }
        .upload.dragover { border-color: var(--accent); background: var(--accent-bg); }
        
        .upload-icon {
            width: 48px; height: 48px; border-radius: 12px;
            background: var(--accent-bg);
            display: flex; align-items: center; justify-content: center;
        }
        .upload-icon svg { width: 24px; height: 24px; color: var(--accent); }
        .upload-title { font-size: 14px; font-weight: 500; }
        .upload-hint { font-size: 12px; color: var(--text-3); }
        
        .btn-outline {
            height: 32px; padding: 0 12px; border-radius: 6px;
            border: 1px solid var(--border); background: var(--bg-card);
            font-size: 12px; color: var(--text-2);
        }
        .btn-outline:hover { background: var(--bg-hover); }
        
        /* ============ 元素条 ============ */
        .elements-bar {
            border-top: 1px solid var(--border);
            background: var(--bg-card);
            flex-shrink: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 80px;
        }
        
        .elements-header {
            height: 36px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        
        .elements-title { font-size: 11px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.5px; }
        .elements-actions { display: flex; align-items: center; gap: 8px; }
        .elements-count { font-size: 12px; color: var(--text-3); }
        
        .btn-sm {
            height: 24px; padding: 0 8px; border-radius: 4px;
            font-size: 11px; font-weight: 500;
            display: inline-flex; align-items: center; gap: 4px;
        }
        
        .btn-sm-primary { background: var(--accent); color: #fff; }
        .btn-sm-primary:hover { background: var(--accent-hover); }
        .btn-sm-ghost { color: var(--text-2); }
        .btn-sm-ghost:hover { background: var(--bg-hover); }
        
        /* 元素容器 */
        .elements-container {
            flex: 1;
            overflow: auto;
            padding: 12px 16px;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }
        
        /* 单行模式 - 横向滚动 */
        .elements-container.single-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            overflow-y: hidden;
            flex-wrap: nowrap;
            align-items: center;
        }
        
        /* 多行模式 - 自适应网格 */
        .elements-container.multi-row {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(var(--card-size, 64px), 1fr));
            gap: 8px;
            align-content: start;
        }
        
        /* 自定义滚动条 */
        .elements-container::-webkit-scrollbar { width: 6px; height: 6px; }
        .elements-container::-webkit-scrollbar-track { background: transparent; }
        .elements-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .elements-container::-webkit-scrollbar-thumb:hover { background: var(--text-3); }
        
        /* 元素卡片 */
        .elem-card {
            width: 72px; height: 72px;
            border-radius: 6px;
            border: 2px solid var(--border);
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
            transition: border-color 0.15s;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .elem-card:hover { border-color: var(--accent); }
        .elem-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-bg); }
        
        .elem-card img {
            width: 100%; height: 100%;
            object-fit: contain;
            background: var(--bg);
            pointer-events: none;
        }
        
        .elem-card .num {
            position: absolute; top: 2px; left: 2px;
            width: 16px; height: 16px; border-radius: 8px;
            background: rgba(0,0,0,0.6); color: #fff;
            font-size: 10px; font-weight: 600;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
        }
        
        .card-delete {
            position: absolute; top: 2px; right: 2px;
            width: 16px; height: 16px; border-radius: 8px;
            background: rgba(220, 38, 38, 0.8); color: #fff;
            font-size: 12px; font-weight: 600;
            display: flex; align-items: center; justify-content: center;
            opacity: 0;
            transition: opacity 0.15s;
        }
        
        .elem-card:hover .card-delete {
            opacity: 1;
        }
        
        .card-delete:hover {
            background: rgba(220, 38, 38, 1);
        }
        
        /* ============ 工具栏 ============ */
        .toolbar {
            position: absolute;
            top: 12px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            z-index: 50;
            pointer-events: none;
        }
        
        .toolbar > * {
            pointer-events: auto;
        }
        
        .toolbar-inner {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .tool-btn {
            height: 32px; padding: 0 10px;
            border-radius: 6px;
            font-size: 12px; font-weight: 500;
            display: flex; align-items: center; gap: 4px;
            color: var(--text-2);
        }
        .tool-btn:hover { background: var(--bg-hover); color: var(--text); }
        .tool-btn.active { background: var(--accent-bg); color: var(--accent); }
        
        .tool-divider {
            width: 1px; height: 20px;
            background: var(--border);
        }
        
        .tool-hint {
            font-size: 11px; color: var(--text-3);
            padding: 0 8px;
        }
        
        /* Canvas overlay for lasso */
        .canvas-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            cursor: crosshair;
            z-index: 40;
        }
        
        /* ============ 框选 ============ */
        .marquee {
            position: absolute;
            border: 2px dashed var(--accent);
            background: rgba(37, 99, 235, 0.15);
            pointer-events: none;
            z-index: 100;
            display: none;
            box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.3);
        }
        
        /* ============ 侧边栏 ============ */
        .section { padding: 16px; border-bottom: 1px solid var(--border); }
        .section:last-child { border-bottom: none; }
        .section-title { font-size: 11px; font-weight: 600; color: var(--text-2); margin-bottom: 12px; }
        
        .select {
            width: 100%; height: 32px; padding: 0 10px;
            border: 1px solid var(--border); border-radius: 6px;
            background: var(--bg-card); color: var(--text);
            outline: none; cursor: pointer;
        }
        .select:focus { border-color: var(--accent); }
        
        .range {
            width: 100%; height: 4px;
            -webkit-appearance: none;
            background: var(--border); border-radius: 2px;
            outline: none; margin: 6px 0;
        }
        .range::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px; height: 14px;
            background: var(--accent); border-radius: 50%;
            cursor: pointer; box-shadow: var(--shadow);
        }
        
        .field { margin-bottom: 12px; }
        .field:last-child { margin-bottom: 0; }
        
        .field-head { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .field-label { font-size: 12px; color: var(--text-2); }
        .field-value { font-size: 12px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
        
        .presets { display: flex; flex-wrap: wrap; gap: 4px; }
        
        .preset {
            height: 26px; padding: 0 8px;
            border-radius: 4px; border: 1px solid var(--border);
            background: var(--bg-card); font-size: 11px; color: var(--text-2);
        }
        .preset:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
        
        .actions { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-top: 1px solid var(--border); margin-top: auto; }
        
        .btn {
            height: 36px; border-radius: 6px;
            font-size: 13px; font-weight: 500;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%;
        }
        
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
        .btn-primary:disabled { background: var(--border); color: var(--text-3); cursor: not-allowed; }
        
        .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover:not(:disabled) { background: var(--bg-hover); }
        .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* 结果网格 */
        .results {
            flex: 1; overflow-y: auto; padding: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px; align-content: start;
        }
        
        .result-card {
            aspect-ratio: 1; border-radius: 6px;
            border: 1px solid var(--border);
            overflow: hidden; cursor: pointer;
            position: relative; background: var(--bg);
        }
        .result-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .result-card img { width: 100%; height: 100%; object-fit: contain; }
        .result-card .label {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 4px 8px;
            background: linear-gradient(transparent, rgba(0,0,0,0.6));
            color: #fff; font-size: 11px; text-align: center;
        }
        
        /* 空状态 */
        .empty {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 12px; padding: 40px; color: var(--text-3);
        }
        .empty svg { width: 48px; height: 48px; opacity: 0.5; }
        .empty p { font-size: 14px; }
        
        /* 状态栏 */
        .statusbar {
            height: 24px; background: var(--bg-card);
            border-top: 1px solid var(--border);
            padding: 0 16px;
            display: flex; align-items: center; justify-content: space-between;
            font-size: 11px; color: var(--text-3);
            flex-shrink: 0;
        }
        
        .status-left { display: flex; align-items: center; gap: 6px; }
        
        .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
        .dot.loading { background: var(--warn); animation: pulse 1s infinite; }
        .dot.error { background: var(--danger); }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        /* Modal */
        .modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.5);
            display: none; align-items: center; justify-content: center;
            z-index: 1000; backdrop-filter: blur(4px);
        }
        .modal.active { display: flex; }
        .modal.active { display: flex; }
        .modal-body { position: relative; max-width: 90vw; max-height: 90vh; }
        .modal-body img { max-width: 100%; max-height: 90vh; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .modal-close {
            position: absolute; top: -40px; right: 0;
            width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255,255,255,0.2); color: #fff;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-close:hover { background: rgba(255,255,255,0.3); }
        .modal-close svg { width: 16px; height: 16px; }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M15 3v18"/><path d="M3 9h18"/><path d="M3 15h18"/></svg>
                元素拆分工具
            </div>
            <div class="tabs">
                <button class="tab active" data-panel="split">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                    切分 <span class="badge hidden" id="splitBadge">0</span>
                </button>
                <button class="tab" data-panel="remove">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
                    抠图 <span class="badge hidden" id="removeBadge">0</span>
                </button>
            </div>
            <div class="spacer"></div>
            <div class="version">v1.0</div>
        </header>
        
        <main class="main">
            <!-- 切分面板 -->
            <div class="panel active" id="panel-split">
                <div class="layout">
                    <div class="content">
                        <div class="preview" id="splitPreview" onselectstart="return false" style="flex: 6;">
                            <!-- 工具栏 -->
                            <div class="toolbar" id="toolbar" style="display:none;">
                                <div class="toolbar-inner">
                                    <button class="tool-btn" id="lassoBtn" title="套索工具 (L)">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
                                        套索
                                    </button>
                                    <div class="tool-divider"></div>
                                    <span class="tool-hint" id="toolHint"></span>
                                </div>
                            </div>
                            <div class="upload" id="uploadZone">
                                <div class="upload-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                                </div>
                                <div class="upload-title">拖拽图片到此处</div>
                                <div class="upload-hint">或点击选择 · PNG、JPG、WebP</div>
                                <button class="btn-outline" id="loadExampleBtn">加载示例图片</button>
                            </div>
                            <img id="splitImage" class="hidden" draggable="false">
                            <canvas id="overlayCanvas" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;"></canvas>
                            <div class="marquee" id="marquee"></div>
                        </div>
                        <div class="elements-bar hidden" id="splitBar" style="flex: 3;">
                            <div class="bar-resize"></div>
                            <div class="elements-header">
                                <span class="elements-title">检测到的元素</span>
                                <div class="elements-actions">
                                    <span class="elements-count" id="splitCount">0 个</span>
                                    <button class="btn-sm btn-sm-ghost" id="selectSplitAll">全选</button>
                                    <button class="btn-sm btn-sm-ghost" id="deselectSplitAll">取消</button>
                                    <button class="btn-sm btn-sm-primary" id="sendBtn">
                                        发送到抠图
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                                    </button>
                                </div>
                            </div>
                            <div class="elements-container single-row" id="splitList"></div>
                        </div>
                    </div>
                    <div class="sidebar">
                        <div class="sidebar-resize"></div>
                        <div class="section">
                            <div class="section-title">检测方法</div>
                            <select class="select" id="detectMethod">
                                <option value="smart">智能检测</option>
                                <option value="canny">Canny 边缘</option>
                                <option value="flood">泛洪填充</option>
                                <option value="alpha">Alpha 通道</option>
                            </select>
                        </div>
                        <div class="section">
                            <div class="section-title" style="display:flex;justify-content:space-between;align-items:center;">
                                快速预设
                                <button class="btn-sm btn-sm-ghost" id="resetBtn" title="重置当前方法参数">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                                    重置
                                </button>
                            </div>
                            <div class="presets">
                                <button class="preset" data-p="sticker">贴纸/图标</button>
                                <button class="preset" data-p="sprite">游戏精灵</button>
                                <button class="preset" data-p="handdrawn">手绘插画</button>
                                <button class="preset" data-p="solid">纯色背景</button>
                            </div>
                        </div>
                        <div class="section" id="secSmart">
                            <div class="section-title">智能检测</div>
                            <div class="field">
                                <select class="select" id="smartMode">
                                    <option value="auto">自动选择</option>
                                    <option value="color">颜色分割</option>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-body">
            <button class="modal-close" id="modalClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>

    <input type="file" id="fileInput" accept="image/*" style="display:none">
    <input type="file" id="elemInput" accept="image/*" multiple style="display:none">
    
    <script>
        const API = 'http://localhost:8001';
        const $ = id => document.getElementById(id);
        const show = el => el.classList.remove('hidden');
        const hide = el => el.classList.add('hidden');
        
        // 阻止全局的拖拽和选择行为
        document.addEventListener('dragstart', e => e.preventDefault());
        
        // 在预览区域阻止文本选择（不阻止元素卡片的双击）
        document.addEventListener('selectstart', e => {
            if (e.target.closest('.preview') && !e.target.closest('.elem-card')) {
                e.preventDefault();
                return false;
            }
        });
        
        const state = {
            splitImageId: null,
            splitElements: [],
            removeElements: []
        };
        
        // ============ 工具函数 ============
        function setStatus(text, loading = false, error = false) {
            $('statusText').textContent = text;
            $('dot').className = 'dot' + (loading ? ' loading' : '') + (error ? ' error' : '');
        }
        
        function updateBadges() {
            const s = state.splitElements.filter(e => e.selected).length;
            const r = state.removeElements.filter(e => e.selected).length;
            const sb = $('splitBadge'), rb = $('removeBadge');
            s > 0 ? (sb.textContent = s, show(sb)) : hide(sb);
            r > 0 ? (rb.textContent = r, show(rb)) : hide(rb);
        }
        
        // ============ Tab ============
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                $('panel-' + tab.dataset.panel).classList.add('active');
            });
        });
        
        // ============ Modal ============
        function openModal(src) { $('modalImg').src = src; $('modal').classList.add('active'); }
        function closeModal() { $('modal').classList.remove('active'); }
        $('modalClose').addEventListener('click', closeModal);
        $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
        document.addEventListener('keydown', e => { 
            if (e.key === 'Escape') { closeModal(); exitLassoMode(); } 
            if (e.key === 'l' || e.key === 'L') { 
                if (lassoMode) exitLassoMode(); else enterLassoMode(); 
            }
        });
        
        // ============ 套索工具 ============
        let lassoMode = false;
        let lassoPoints = [];
        let lassoCanvas = null;
        let lassoCtx = null;
        
        function enterLassoMode() {
            if (!state.splitImageId) { setStatus('请先上传图片', false, true); return; }
            
            lassoMode = true;
            lassoPoints = [];
            $('lassoBtn').classList.add('active');
            $('toolHint').textContent = '绘制轮廓，松手闭合';
            
            // 创建 Canvas overlay
            const preview = $('splitPreview');
            lassoCanvas = document.createElement('canvas');
            lassoCanvas.className = 'canvas-overlay';
            lassoCanvas.width = preview.offsetWidth;
            lassoCanvas.height = preview.offsetHeight;
            preview.appendChild(lassoCanvas);
            lassoCtx = lassoCanvas.getContext('2d');
            
            // 绑定事件
            lassoCanvas.addEventListener('mousedown', onLassoStart);
            lassoCanvas.addEventListener('mousemove', onLassoMove);
            lassoCanvas.addEventListener('mouseup', onLassoEnd);
        }
        
        function exitLassoMode() {
            lassoMode = false;
            lassoPoints = [];
            $('lassoBtn').classList.remove('active');
            $('toolHint').textContent = '';
            
            if (lassoCanvas) {
                lassoCanvas.remove();
                lassoCanvas = null;
                lassoCtx = null;
            }
        }
        
        function onLassoStart(e) {
            lassoPoints = [];
            const rect = lassoCanvas.getBoundingClientRect();
            lassoPoints.push({ x: e.clientX - rect.left, y: e.clientY - rect.top });
            lassoCtx.clearRect(0, 0, lassoCanvas.width, lassoCanvas.height);
        }
        
        function onLassoMove(e) {
            if (lassoPoints.length === 0) return;
            
            const rect = lassoCanvas.getBoundingClientRect();
            lassoPoints.push({ x: e.clientX - rect.left, y: e.clientY - rect.top });
            
            // 绘制路径
            lassoCtx.clearRect(0, 0, lassoCanvas.width, lassoCanvas.height);
            lassoCtx.beginPath();
            lassoCtx.moveTo(lassoPoints[0].x, lassoPoints[0].y);
            for (let i = 1; i < lassoPoints.length; i++) {
                lassoCtx.lineTo(lassoPoints[i].x, lassoPoints[i].y);
            }
            lassoCtx.strokeStyle = 'var(--accent)';
            lassoCtx.lineWidth = 2;
            lassoCtx.setLineDash([5, 5]);
            lassoCtx.stroke();
            lassoCtx.setLineDash([]);
        }
        
        function onLassoEnd(e) {
            if (lassoPoints.length < 10) {
                exitLassoMode();
                return;
            }
            
            // 闭合路径
            lassoCtx.clearRect(0, 0, lassoCanvas.width, lassoCanvas.height);
            lassoCtx.beginPath();
            lassoCtx.moveTo(lassoPoints[0].x, lassoPoints[0].y);
            for (let i = 1; i < lassoPoints.length; i++) {
                lassoCtx.lineTo(lassoPoints[i].x, lassoPoints[i].y);
            }
            lassoCtx.closePath();
            lassoCtx.fillStyle = 'rgba(37, 99, 235, 0.2)';
            lassoCtx.fill();
            lassoCtx.strokeStyle = 'var(--accent)';
            lassoCtx.lineWidth = 2;
            lassoCtx.stroke();
            
            // 获取原图尺寸
            const img = $('splitImage');
            const imgNaturalW = img.naturalWidth;
            const imgNaturalH = img.naturalHeight;
            const imgDisplayW = img.offsetWidth;
            const imgDisplayH = img.offsetHeight;
            
            // 计算缩放比例
            const scaleX = imgNaturalW / imgDisplayW;
            const scaleY = imgNaturalH / imgDisplayH;
            
            // 计算图片在画布中的偏移
            const imgRect = img.getBoundingClientRect();
            const canvasRect = lassoCanvas.getBoundingClientRect();
            const offsetX = imgRect.left - canvasRect.left;
            const offsetY = imgRect.top - canvasRect.top;
            
            // 生成 mask（使用原图尺寸）
            const maskCanvas = document.createElement('canvas');
            maskCanvas.width = imgNaturalW;
            maskCanvas.height = imgNaturalH;
            const maskCtx = maskCanvas.getContext('2d');
            maskCtx.fillStyle = 'black';
            maskCtx.fillRect(0, 0, maskCanvas.width, maskCanvas.height);
            maskCtx.beginPath();
            // 将坐标从画布坐标转换为原图坐标
            const firstX = (lassoPoints[0].x - offsetX) * scaleX;
            const firstY = (lassoPoints[0].y - offsetY) * scaleY;
            maskCtx.moveTo(firstX, firstY);
            for (let i = 1; i < lassoPoints.length; i++) {
                const x = (lassoPoints[i].x - offsetX) * scaleX;
                const y = (lassoPoints[i].y - offsetY) * scaleY;
                maskCtx.lineTo(x, y);
            }
            maskCtx.closePath();
            maskCtx.fillStyle = 'white';
            maskCtx.fill();
            
            // 直接提交，不显示弹窗
            const maskData = maskCanvas.toDataURL('image/png');
            exitLassoMode();
            submitLasso(maskData, false);
        }
        
        // 套索按钮
        $('lassoBtn').addEventListener('click', () => {
            if (lassoMode) {
                exitLassoMode();
            } else {
                enterLassoMode();
            }
        });
        
        async function submitLasso(maskData, autoDetect) {
            setStatus('套索切分中...', true);
            
            const fd = new FormData();
            fd.append('image_id', state.splitImageId);
            fd.append('mask_base64', maskData);
            fd.append('auto_detect_remaining', autoDetect);
            fd.append('detect_method', $('detectMethod').value);
            fd.append('sensitivity', $('sensitivity').value);
            fd.append('min_area', $('minArea').value);
            fd.append('merge_distance', $('mergeDist').value);
            fd.append('crop_padding', $('padding').value);
            
            try {
                const res = await fetch(API + '/api/lasso', { method: 'POST', body: fd });
                if (!res.ok) throw new Error('套索切分失败');
                const data = await res.json();
                
                // 添加套索元素
                const lassoEl = data.lasso_element;
                lassoEl.index = state.splitElements.length + 1;
                lassoEl.selected = true;
                state.splitElements.push(lassoEl);
                console.log('添加套索元素，index:', lassoEl.index);
                
                // 添加剩余元素
                if (data.remaining_elements) {
                    data.remaining_elements.forEach(el => {
                        el.index = state.splitElements.length + 1;
                        el.selected = true;
                        state.splitElements.push(el);
                        console.log('添加剩余元素，index:', el.index);
                    });
                }
                
                renderSplitElements();
                setStatus(`套索切分完成，共 ${state.splitElements.length} 个元素`);
            } catch (err) {
                setStatus(err.message, false, true);
            }
        }
        
        // 元素条布局
        function updateElementsLayout() {
            document.querySelectorAll('.elements-bar').forEach(bar => {
                const container = bar.querySelector('.elements-container');
                if (!container) return;
                const h = bar.offsetHeight;
                const w = container.offsetWidth;
                
                if (h > 120) {
                    // 多行模式 - 计算最优卡片大小
                    container.className = 'elements-container multi-row';
                    const count = container.children.length;
                    if (count > 0) {
                        // 计算能放多少列，然后确定卡片大小
                        const gap = 8;
                        const padding = 32;
                        const availableWidth = w - padding;
                        const minCardSize = 56;
                        const maxCardSize = 120;
                        
                        // 计算列数
                        let cols = Math.floor((availableWidth + gap) / (minCardSize + gap));
                        cols = Math.max(1, cols);
                        
                        // 计算卡片大小
                        let cardSize = Math.floor((availableWidth - (cols - 1) * gap) / cols);
                        cardSize = Math.min(maxCardSize, Math.max(minCardSize, cardSize));
                        
                        container.style.setProperty('--card-size', cardSize + 'px');
                        
                        // 更新卡片大小
                        container.querySelectorAll('.elem-card').forEach(card => {
                            card.style.width = cardSize + 'px';
                            card.style.height = cardSize + 'px';
                        });
                    }
                } else {
                    // 单行模式
                    container.className = 'elements-container single-row';
                    container.style.removeProperty('--card-size');
                    container.querySelectorAll('.elem-card').forEach(card => {
                        card.style.width = '64px';
                        card.style.height = '64px';
                    });
                }
            });
        }
        
        // 使用 ResizeObserver 监听容器大小变化
        const resizeObserver = new ResizeObserver(() => {
            updateElementsLayout();
            drawOverlay();
        });
        
        // ============ 拖拽调节 ============
        // 侧栏宽度拖拽
        document.querySelectorAll('.sidebar-resize').forEach(handle => {
            const sidebar = handle.parentElement;
            let startX, startWidth;
            
            handle.addEventListener('mousedown', e => {
                e.preventDefault();
                startX = e.clientX;
                startWidth = sidebar.offsetWidth;
                
                const onMove = e => {
                    const delta = startX - e.clientX;
                    const newWidth = Math.min(400, Math.max(200, startWidth + delta));
                    sidebar.style.width = newWidth + 'px';
                };
                
                const onUp = () => {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                };
                
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
        });
        
        // 底栏高度拖拽
        document.querySelectorAll('.bar-resize').forEach(handle => {
            const bar = handle.parentElement;
            let startY, startFlex;
            
            handle.addEventListener('mousedown', e => {
                e.preventDefault();
                startY = e.clientY;
                startFlex = parseFloat(bar.style.flex) || 4;
                const parentHeight = bar.parentElement.offsetHeight;
                const startPixel = (startFlex / 10) * parentHeight;
                
                const onMove = e => {
                    const delta = startY - e.clientY;
                    const newPixel = Math.min(parentHeight * 0.7, Math.max(60, startPixel + delta));
                    const contentFlex = parseFloat(bar.previousElementSibling?.style.flex) || 6;
                    const newFlex = (newPixel / parentHeight) * 10;
                    bar.style.flex = newFlex;
                    if (bar.previousElementSibling) {
                        bar.previousElementSibling.style.flex = 10 - newFlex;
                    }
                    updateElementsLayout();
                };
                
                const onUp = () => {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                };
                
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
        });
        
        // ============ 框选 ============
        function initMarquee(previewId, elementsKey) {
            const preview = $(previewId);
            const marquee = preview.querySelector('.marquee');
            let active = false, sx, sy, altKey = false;
            
            // 阻止默认的拖拽和选择行为
            preview.addEventListener('dragstart', e => e.preventDefault());
            preview.addEventListener('selectstart', e => {
                e.preventDefault();
                return false;
            });
            
            preview.addEventListener('mousedown', e => {
                // 忽略按钮和缩略图点击
                if (e.target.closest('button') || e.target.closest('.elem-card') || e.target.closest('.upload')) return;
                
                e.preventDefault();
                active = true;
                altKey = e.altKey; // 记录 Alt 键状态
                const rect = preview.getBoundingClientRect();
                sx = e.clientX - rect.left;
                sy = e.clientY - rect.top;
                
                // 显示选框
                marquee.style.display = 'block';
                marquee.style.left = sx + 'px';
                marquee.style.top = sy + 'px';
                marquee.style.width = '0px';
                marquee.style.height = '0px';
            });
            
            preview.addEventListener('mousemove', e => {
                if (!active) return;
                e.preventDefault();
                const rect = preview.getBoundingClientRect();
                const cx = e.clientX - rect.left;
                const cy = e.clientY - rect.top;
                
                const x = Math.min(sx, cx);
                const y = Math.min(sy, cy);
                const w = Math.abs(cx - sx);
                const h = Math.abs(cy - sy);
                
                marquee.style.left = x + 'px';
                marquee.style.top = y + 'px';
                marquee.style.width = w + 'px';
                marquee.style.height = h + 'px';
            });
            
            preview.addEventListener('mouseup', e => {
                if (!active) return;
                e.preventDefault();
                active = false;
                
                // 获取选框区域
                const box = marquee.getBoundingClientRect();
                marquee.style.display = 'none';
                
                // 如果选框太小，忽略
                if (box.width < 5 || box.height < 5) return;
                
                // 选中或取消选中框内的元素
                const cards = preview.querySelectorAll('.elem-card');
                let count = 0;
                
                cards.forEach(card => {
                    const cardRect = card.getBoundingClientRect();
                    if (intersects(box, cardRect)) {
                        const idx = parseInt(card.dataset.index);
                        const el = state[elementsKey].find(e => e.index === idx);
                        if (el) {
                            if (altKey) {
                                // Alt 键：减选
                                el.selected = false;
                                card.classList.remove('selected');
                            } else {
                                // 普通框选：选中
                                el.selected = true;
                                card.classList.add('selected');
                            }
                            count++;
                        }
                    }
                });
                
                if (count > 0) {
                    updateBadges();
                    setStatus(altKey ? '取消选中了 ' + count + ' 个元素' : '框选了 ' + count + ' 个元素');
                }
            });
            
            // 文档级别的 mouseup，确保鼠标离开预览区域时也能结束框选
            document.addEventListener('mouseup', e => {
                if (!active) return;
                active = false;
                marquee.style.display = 'none';
            });
            
            function intersects(a, b) {
                return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
            }
        }
        
        // ============ 切分面板 ============
        
        // 加载示例
        $('loadExampleBtn').addEventListener('click', async e => {
            e.stopPropagation();
            setStatus('加载示例...', true);
            try {
                const res = await fetch('/example/sticker-annotation-sheet.png');
                const blob = await res.blob();
                uploadImage(new File([blob], 'example.png', { type: 'image/png' }));
            } catch { setStatus('加载失败', false, true); }
        });
        
        // 上传
        $('uploadZone').addEventListener('click', () => $('fileInput').click());
        $('uploadZone').addEventListener('dragover', e => { e.preventDefault(); e.currentTarget.classList.add('dragover'); });
        $('uploadZone').addEventListener('dragleave', e => e.currentTarget.classList.remove('dragover'));
        $('uploadZone').addEventListener('drop', e => { e.preventDefault(); e.currentTarget.classList.remove('dragover'); if (e.dataTransfer.files[0]) uploadImage(e.dataTransfer.files[0]); });
        $('fileInput').addEventListener('change', e => { if (e.target.files[0]) uploadImage(e.target.files[0]); });
        
        async function uploadImage(file) {
            setStatus('上传中...', true);
            const fd = new FormData(); fd.append('file', file);
            try {
                const res = await fetch(API + '/api/upload', { method: 'POST', body: fd });
                if (!res.ok) throw new Error('上传失败');
                const data = await res.json();
                state.splitImageId = data.image_id;
                $('splitImage').src = data.preview;
                show($('splitImage')); hide($('uploadZone'));
                $('toolbar').style.display = 'flex';
                setStatus(data.filename + ' (' + data.width + '×' + data.height + ')');
                runDetection();
            } catch (err) { setStatus(err.message, false, true); }
        }
        
        // 参数
        document.querySelectorAll('#panel-split .range').forEach(slider => {
            const val = $('v_' + slider.id);
            if (val) slider.addEventListener('input', () => { val.textContent = slider.value; autoDetect(); });
        });
        
        $('detectMethod').addEventListener('change', e => {
            const m = e.target.value;
            $('secSmart').classList.toggle('hidden', m !== 'smart');
            $('secCanny').classList.toggle('hidden', m !== 'canny');
            $('secFlood').classList.toggle('hidden', m !== 'flood');
            autoDetect();
        });
        
        $('smartMode').addEventListener('change', autoDetect);
        
        // 预设
        document.querySelectorAll('.preset').forEach(btn => {
            btn.addEventListener('click', () => {
                const P = {
                    sticker: { method: 'smart', smartMode: 'color', sensitivity: 60, minArea: 300, mergeDist: 30 },
                    sprite: { method: 'canny', gaussSigma: 1.0, threshold1: 50, threshold2: 150, closeIter: 2, dilateIter: 2, minArea: 200, mergeDist: 15 },
                    handdrawn: { method: 'smart', smartMode: 'edge', sensitivity: 40, minArea: 800, mergeDist: 25 },
                    solid: { method: 'flood', floodTol: 50, minArea: 300 }
                };
                const p = P[btn.dataset.p]; if (!p) return;
                $('detectMethod').value = p.method;
                $('detectMethod').dispatchEvent(new Event('change'));
                for (const [k, v] of Object.entries(p)) {
                    if (k === 'method') continue;
                    const el = $(k); if (el) { el.value = v; const val = $('v_' + k); if (val) val.textContent = v; }
                }
                autoDetect();
            });
        });
        
        // 重置按钮
        $('resetBtn').addEventListener('click', () => {
            const method = $('detectMethod').value;
            const defaults = {
                smart: { smartMode: 'auto', sensitivity: 50, minArea: 500, mergeDist: 20 },
                canny: { gaussSigma: 1.0, threshold1: 50, threshold2: 150, closeIter: 1, dilateIter: 1, minArea: 500, mergeDist: 20 },
                flood: { floodTol: 30, minArea: 500 }
            };
            
            const d = defaults[method];
            if (!d) return;
            
            for (const [k, v] of Object.entries(d)) {
                const el = $(k);
                if (el) {
                    el.value = v;
                    const val = $('v_' + k);
                    if (val) val.textContent = v;
                }
            }
            
            autoDetect();
            setStatus('已重置为默认参数');
        });
        
        // 检测
        let detectTimer = null;
        function autoDetect() { if (!state.splitImageId) return; clearTimeout(detectTimer); detectTimer = setTimeout(runDetection, 300); }
        
        let isDetecting = false;
        async function runDetection() {
            if (!state.splitImageId || isDetecting) return;
            isDetecting = true;
            setStatus('检测中...', true);
            
            const method = $('detectMethod').value;
            const fd = new FormData();
            fd.append('image_id', state.splitImageId);
            fd.append('method', method);
            
            // 通用参数
            fd.append('crop_padding', $('padding').value);
            
            if (method === 'smart') {
                fd.append('smart_mode', $('smartMode').value);
                fd.append('sensitivity', $('sensitivity').value);
                fd.append('min_area', $('minArea').value);
                fd.append('merge_distance', $('mergeDist').value);
            } else if (method === 'canny') {
                fd.append('gauss_sigma', $('gaussSigma').value);
                fd.append('threshold1', $('threshold1').value);
                fd.append('threshold2', $('threshold2').value);
                fd.append('close_iter', $('closeIter').value);
                fd.append('dilate_iter', $('dilateIter').value);
                fd.append('min_area', $('minArea').value);
                fd.append('merge_distance', $('mergeDist').value);
            } else if (method === 'flood') {
                fd.append('flood_tolerance', $('floodTol').value);
                fd.append('min_area', $('minArea').value);
            }
            
            try {
                const res = await fetch(API + '/api/detect', { method: 'POST', body: fd });
                if (!res.ok) throw new Error('检测失败');
                const data = await res.json();
                $('splitImage').src = data.preview;
                state.splitElements = (data.elements || []).map(el => ({ ...el, selected: true }));
                renderSplitElements();
                setStatus('找到 ' + data.count + ' 个元素');
            } catch (err) { setStatus(err.message, false, true); }
            finally { isDetecting = false; }
        }
        
        function renderSplitElements() {
            const has = state.splitElements.length > 0;
            $('splitBar').classList.toggle('hidden', !has);
            $('splitCount').textContent = state.splitElements.length + ' 个';
            
            const list = $('splitList');
            list.innerHTML = '';
            
            state.splitElements.forEach((el, i) => {
                const div = document.createElement('div');
                div.className = 'elem-card' + (el.selected ? ' selected' : '');
                div.dataset.index = el.index;
                div.innerHTML = '<img src="' + el.preview + '"><span class="num">' + el.index + '</span><button class="card-delete" title="删除">×</button>';
                div.addEventListener('click', e => {
                    if (e.target.classList.contains('card-delete')) return;
                    if (e.shiftKey) { el.selected = true; }
                    else { el.selected = !el.selected; }
                    div.classList.toggle('selected', el.selected);
                    updateBadges();
                });
                div.addEventListener('dblclick', e => {
                    if (e.target.classList.contains('card-delete')) return;
                    openModal(el.preview);
                });
                div.querySelector('.card-delete').addEventListener('click', e => {
                    e.stopPropagation();
                    state.splitElements.splice(i, 1);
                    renderSplitElements();
                });
                list.appendChild(div);
            });
            
            updateBadges();
            updateElementsLayout();
            drawOverlay();
        }
        
        // 绘制画布上的边框
        function drawOverlay() {
            const canvas = $('overlayCanvas');
            const img = $('splitImage');
            const preview = $('splitPreview');
            if (!canvas || !img || img.classList.contains('hidden')) return;
            
            // 获取容器和图片的位置
            const containerRect = preview.getBoundingClientRect();
            const imgRect = img.getBoundingClientRect();
            
            // 设置 canvas 尺寸为实际像素（解决模糊问题）
            const dpr = window.devicePixelRatio || 1;
            canvas.width = containerRect.width * dpr;
            canvas.height = containerRect.height * dpr;
            canvas.style.width = containerRect.width + 'px';
            canvas.style.height = containerRect.height + 'px';
            
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (!state.splitElements.length) return;
            
            // 计算图片在容器中的偏移
            const offsetX = imgRect.left - containerRect.left;
            const offsetY = imgRect.top - containerRect.top;
            
            // 计算缩放比例
            const scaleX = imgRect.width / img.naturalWidth;
            const scaleY = imgRect.height / img.naturalHeight;
            
            state.splitElements.forEach((el, i) => {
                const [x, y, w, h] = el.bbox;
                const sx = offsetX + x * scaleX;
                const sy = offsetY + y * scaleY;
                const sw = w * scaleX;
                const sh = h * scaleY;
                
                // 绘制绿色边框
                ctx.strokeStyle = '#22c55e';
                ctx.lineWidth = 2;
                ctx.strokeRect(sx, sy, sw, sh);
                
                // 绘制编号标签
                ctx.fillStyle = '#22c55e';
                ctx.font = 'bold 11px sans-serif';
                const text = String(el.index);
                const tw = ctx.measureText(text).width + 8;
                ctx.fillRect(sx, sy - 18, tw, 18);
                ctx.fillStyle = '#fff';
                ctx.fillText(text, sx + 4, sy - 5);
            });
            
            // 启用交互
            canvas.style.pointerEvents = 'auto';
        }
        
        // 点击画布上的边框删除元素
        $('overlayCanvas').addEventListener('click', e => {
            if (!state.splitElements.length) return;
            
            const canvas = $('overlayCanvas');
            const img = $('splitImage');
            const preview = $('splitPreview');
            const containerRect = preview.getBoundingClientRect();
            const imgRect = img.getBoundingClientRect();
            const clickX = e.clientX - containerRect.left;
            const clickY = e.clientY - containerRect.top;
            
            const offsetX = imgRect.left - containerRect.left;
            const offsetY = imgRect.top - containerRect.top;
            const scaleX = imgRect.width / img.naturalWidth;
            const scaleY = imgRect.height / img.naturalHeight;
            
            // 检查点击是否在某个边框内
            for (let i = state.splitElements.length - 1; i >= 0; i--) {
                const el = state.splitElements[i];
                const [x, y, w, h] = el.bbox;
                const sx = offsetX + x * scaleX;
                const sy = offsetY + y * scaleY;
                const sw = w * scaleX;
                const sh = h * scaleY;
                
                if (clickX >= sx && clickX <= sx + sw && clickY >= sy && clickY <= sy + sh) {
                    state.splitElements.splice(i, 1);
                    renderSplitElements();
                    setStatus('已删除元素 ' + el.index);
                    return;
                }
            }
        });
        
        // 鼠标悬停样式
        $('overlayCanvas').addEventListener('mousemove', e => {
            if (!state.splitElements.length) return;
            
            const canvas = $('overlayCanvas');
            const img = $('splitImage');
            const preview = $('splitPreview');
            const containerRect = preview.getBoundingClientRect();
            const imgRect = img.getBoundingClientRect();
            const mx = e.clientX - containerRect.left;
            const my = e.clientY - containerRect.top;
            
            const offsetX = imgRect.left - containerRect.left;
            const offsetY = imgRect.top - containerRect.top;
            const scaleX = imgRect.width / img.naturalWidth;
            const scaleY = imgRect.height / img.naturalHeight;
            
            let hovering = false;
            for (const el of state.splitElements) {
                const [x, y, w, h] = el.bbox;
                const sx = offsetX + x * scaleX;
                const sy = offsetY + y * scaleY;
                const sw = w * scaleX;
                const sh = h * scaleY;
                if (mx >= sx && mx <= sx + sw && my >= sy && my <= sy + sh) {
                    hovering = true;
                    break;
                }
            }
            canvas.style.cursor = hovering ? 'pointer' : 'default';
        });
        
        // 窗口大小变化时重绘
        window.addEventListener('resize', () => {
            updateElementsLayout();
            drawOverlay();
        });
        
        $('selectSplitAll').addEventListener('click', () => { state.splitElements.forEach(e => e.selected = true); renderSplitElements(); });
        $('deselectSplitAll').addEventListener('click', () => { state.splitElements.forEach(e => e.selected = false); renderSplitElements(); });
        
        $('sendBtn').addEventListener('click', () => {
            const sel = state.splitElements.filter(e => e.selected);
            if (!sel.length) { setStatus('请先选择元素', false, true); return; }
            
            state.removeElements = sel.map(el => ({
                index: el.index,
                preview: el.preview,
                selected: true,
                processed: false,
                result: null
            }));
            
            renderRemoveElements();
            document.querySelector('.tab[data-panel="remove"]').click();
            setStatus('已发送 ' + sel.length + ' 个元素');
        });
        
        // ============ 抠图面板 ============
        
        $('uploadElemBtn').addEventListener('click', () => $('elemInput').click());
        $('elemInput').addEventListener('change', e => {
            Array.from(e.target.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = () => {
                    state.removeElements.push({ index: state.removeElements.length + 1, preview: reader.result, selected: true, processed: false, result: null });
                    renderRemoveElements();
                };
                reader.readAsDataURL(file);
            });
        });
        
        $('selectRemAll').addEventListener('click', () => { state.removeElements.forEach(e => e.selected = true); renderRemoveElements(); });
        $('deselectRemAll').addEventListener('click', () => { state.removeElements.forEach(e => e.selected = false); renderRemoveElements(); });
        
        $('removeMethod').addEventListener('change', e => {
            const m = e.target.value;
            $('secRembg').classList.toggle('hidden', m !== 'rembg' && m !== 'combined');
            $('secRemFlood').classList.toggle('hidden', m !== 'flood' && m !== 'combined');
        });
        
        $('remFloodTol').addEventListener('input', e => $('v_remFloodTol').textContent = e.target.value);
        
        function renderRemoveElements() {
            const has = state.removeElements.length > 0;
            $('removeEmpty').classList.toggle('hidden', has);
            $('removeBar').classList.toggle('hidden', !has);
            $('removeCount').textContent = state.removeElements.length + ' 个';
            $('processBtn').disabled = !has;
            
            const list = $('removeList');
            list.innerHTML = '';
            
            state.removeElements.forEach((el, i) => {
                const div = document.createElement('div');
                div.className = 'elem-card' + (el.selected ? ' selected' : '');
                div.dataset.index = el.index;
                div.innerHTML = '<img src="' + (el.processed ? el.result : el.preview) + '"><span class="num">' + el.index + '</span><button class="card-delete" title="删除">×</button>';
                div.addEventListener('click', e => {
                    if (e.target.classList.contains('card-delete')) return;
                    if (e.shiftKey) { el.selected = true; } else { el.selected = !el.selected; }
                    div.classList.toggle('selected', el.selected);
                    updateBadges();
                });
                div.addEventListener('dblclick', e => {
                    if (e.target.classList.contains('card-delete')) return;
                    openModal(el.processed ? el.result : el.preview);
                });
                div.querySelector('.card-delete').addEventListener('click', e => {
                    e.stopPropagation();
                    state.removeElements.splice(i, 1);
                    renderRemoveElements();
                });
                list.appendChild(div);
            });
            
            renderRemoveResults();
            updateBadges();
            updateElementsLayout();
        }
        
        function renderRemoveResults() {
            const processed = state.removeElements.filter(e => e.processed);
            const grid = $('removeResults');
            if (!processed.length) { hide(grid); return; }
            show(grid);
            grid.innerHTML = '';
            processed.forEach(el => {
                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = '<img src="' + el.result + '"><div class="label">元素 ' + el.index + '</div>';
                card.addEventListener('click', () => openModal(el.result));
                grid.appendChild(card);
            });
            $('exportBtn').disabled = false;
        }
        
        $('processBtn').addEventListener('click', async () => {
            const sel = state.removeElements.filter(e => e.selected);
            if (!sel.length) { setStatus('请先选择元素', false, true); return; }
            $('processBtn').disabled = true;
            setStatus('抠图中 (0/' + sel.length + ')...', true);
            
            const method = $('removeMethod').value;
            const model = $('rembgModel').value;
            const tol = $('remFloodTol').value;
            
            for (let i = 0; i < sel.length; i++) {
                setStatus('抠图中 (' + (i+1) + '/' + sel.length + ')...', true);
                try {
                    const blob = await fetch(sel[i].preview).then(r => r.blob());
                    const fd = new FormData(); fd.append('file', blob, 'el.png');
                    const up = await (await fetch(API + '/api/upload', { method: 'POST', body: fd })).json();
                    
                    const df = new FormData();
                    df.append('image_id', up.image_id); df.append('method', 'alpha'); df.append('alpha_threshold', '0');
                    await fetch(API + '/api/detect', { method: 'POST', body: df });
                    
                    const rf = new FormData();
                    rf.append('image_id', up.image_id); rf.append('method', method); rf.append('model', model); rf.append('flood_tolerance', tol);
                    const rd = await (await fetch(API + '/api/remove_background', { method: 'POST', body: rf })).json();
                    
                    if (rd.results?.[0]) { sel[i].processed = true; sel[i].result = rd.results[0].preview; }
                } catch (err) { console.error('元素 ' + sel[i].index + ' 失败:', err); }
            }
            
            renderRemoveElements();
            setStatus('完成，处理了 ' + sel.length + ' 个元素');
            $('processBtn').disabled = false;
        });
        
        $('exportBtn').addEventListener('click', () => {
            state.removeElements.filter(e => e.processed).forEach(el => {
                const a = document.createElement('a'); a.href = el.result; a.download = 'element_' + el.index + '.png'; a.click();
            });
        });
        
        // 元素条框选功能
        function initElementsMarquee(containerId, elementsKey) {
            const container = $(containerId);
            if (!container) return;
            
            let active = false, startX, startY, altKey = false;
            let marquee = null;
            
            container.addEventListener('mousedown', e => {
                // 忽略点击在元素卡片上的情况
                if (e.target.closest('.elem-card')) return;
                
                e.preventDefault();
                active = true;
                altKey = e.altKey;
                startX = e.clientX + container.scrollLeft - container.getBoundingClientRect().left;
                startY = e.clientY + container.scrollTop - container.getBoundingClientRect().top;
                
                // 创建选框
                marquee = document.createElement('div');
                marquee.className = 'marquee';
                marquee.style.cssText = 'display:block;position:absolute;left:' + startX + 'px;top:' + startY + 'px;width:0;height:0;pointer-events:none;';
                container.appendChild(marquee);
            });
            
            container.addEventListener('mousemove', e => {
                if (!active || !marquee) return;
                e.preventDefault();
                
                const currentX = e.clientX + container.scrollLeft - container.getBoundingClientRect().left;
                const currentY = e.clientY + container.scrollTop - container.getBoundingClientRect().top;
                
                const x = Math.min(startX, currentX);
                const y = Math.min(startY, currentY);
                const w = Math.abs(currentX - startX);
                const h = Math.abs(currentY - startY);
                
                marquee.style.left = x + 'px';
                marquee.style.top = y + 'px';
                marquee.style.width = w + 'px';
                marquee.style.height = h + 'px';
            });
            
            container.addEventListener('mouseup', e => {
                if (!active || !marquee) return;
                active = false;
                
                const box = marquee.getBoundingClientRect();
                marquee.remove();
                marquee = null;
                
                if (box.width < 5 || box.height < 5) return;
                
                // 选中或取消选中框内的元素
                let count = 0;
                container.querySelectorAll('.elem-card').forEach(card => {
                    const cardRect = card.getBoundingClientRect();
                    if (intersects(box, cardRect)) {
                        const idx = parseInt(card.dataset.index);
                        const el = state[elementsKey].find(e => e.index === idx);
                        if (el) {
                            if (altKey) {
                                // Alt 键：减选
                                el.selected = false;
                                card.classList.remove('selected');
                            } else {
                                // 普通框选：选中
                                el.selected = true;
                                card.classList.add('selected');
                            }
                            count++;
                        }
                    }
                });
                
                if (count > 0) {
                    updateBadges();
                    setStatus(altKey ? '取消选中了 ' + count + ' 个元素' : '框选了 ' + count + ' 个元素');
                }
            });
            
            container.addEventListener('mouseleave', () => {
                if (active && marquee) {
                    active = false;
                    marquee.remove();
                    marquee = null;
                }
            });
            
            function intersects(a, b) {
                return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
            }
        }
        
        // 初始化元素条框选
        initElementsMarquee('splitList', 'splitElements');
        initElementsMarquee('removeList', 'removeElements');
        
        // 启动 ResizeObserver
        document.querySelectorAll('.elements-container').forEach(el => {
            resizeObserver.observe(el);
        });
        
        // 监听预览区域大小变化
        const splitPreview = $('splitPreview');
        if (splitPreview) {
            resizeObserver.observe(splitPreview);
        }
    </script>
</body>
